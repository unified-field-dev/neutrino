[package]
name = "neutrino"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Encrypted secret vault: seal at rest in Valence, audit chain, bootstrap trust"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = "1.7"
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = "0.10"
rand_core = { workspace = true }
blake3 = "1.5"
spectra = { workspace = true, optional = true }
spectra-core = { workspace = true, optional = true }
neutrino-spectra-telemetry = { workspace = true, optional = true }

valence = { workspace = true, optional = true }
gauge = { workspace = true, optional = true, default-features = false }
lepton = { workspace = true, optional = true, default-features = false }
chronon-coordinator = { workspace = true, optional = true }
chronon-core = { workspace = true, optional = true }
chronon-executor = { workspace = true, optional = true }
chronon-coordinator-macros = { workspace = true, optional = true }
chronon-valence-identity = { workspace = true, optional = true }
aws-config = { version = "1", optional = true }
aws-sdk-kms = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "rt"] }
cryptoki = { version = "0.12", optional = true }
tss-esapi = { version = "7.7", optional = true }
photon = { package = "uf-photon", git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false, features = ["runtime"], optional = true }
photon-macros = { git = "https://github.com/unified-field-dev/photon", branch = "main", optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
ssr = [
    "dep:valence",
    "dep:gauge",
    "gauge/ssr",
    "dep:spectra",
    "dep:spectra-core",
    "dep:neutrino-spectra-telemetry",
]
# Photon topic publish for `neutrino.secret.rotated` (Gluon / vault consumers).
photon = ["ssr", "dep:photon", "dep:photon-macros", "dep:futures"]
# Chronon scripts (umbrella revoke migration, future jobs).
chronon = [
    "ssr",
    "dep:chronon-coordinator",
    "dep:chronon-core",
    "dep:chronon-executor",
    "dep:chronon-coordinator-macros",
    "dep:chronon-valence-identity",
]
# Optional Gauge RBAC integration tests — pulls lepton/gauge SSR graph.
rbac-tests = ["ssr", "dep:gauge", "gauge/ssr", "dep:lepton", "lepton/ssr"]
# KMS / HSM master-key `KeySource` adapters.
kms-aws = ["dep:aws-config", "dep:aws-sdk-kms", "dep:tokio"]
kms-gcp = ["dep:reqwest"]
kms-vault-transit = ["dep:reqwest"]
hsm-pkcs11 = ["dep:cryptoki", "dep:tokio"]
hsm-tpm = ["dep:tss-esapi", "dep:tokio"]

[build-dependencies]
valence-codegen = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
valence = { workspace = true }
gauge = { workspace = true, features = ["ssr"] }
lepton = { workspace = true, features = ["ssr"] }
anyhow = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "workspace_members"

[[test]]
name = "product_surface"

[[test]]
name = "sealed_store_idempotent"
required-features = ["ssr"]

[[test]]
name = "lease_grace_contract"
required-features = ["ssr"]

[[test]]
name = "vault_crud_contract"
required-features = ["ssr"]

[[test]]
name = "vault_authz_contract"
required-features = ["ssr"]

[[test]]
name = "vault_security_remediation"
required-features = ["ssr"]

[[test]]
name = "vault_gauge_authz"
required-features = ["rbac-tests"]

[[test]]
name = "vault_server_rbac"
required-features = ["rbac-tests"]

[[test]]
name = "security_contract"
required-features = ["rbac-tests"]

[[test]]
name = "hsm_pkcs11_integration"
required-features = ["hsm-pkcs11"]

[[test]]
name = "hsm_tpm_integration"
required-features = ["hsm-tpm"]

[[test]]
name = "access_matrix_contract"
required-features = ["rbac-tests"]
