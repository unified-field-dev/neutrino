[package]
name = "neutrino"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Encrypted secret vault: seal at rest in Valence, audit chain, bootstrap trust"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = "1.7"
uuid = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = "0.10"
rand_core = { workspace = true }
blake3 = "1.5"
spectra = { workspace = true, optional = true }
spectra-core = { workspace = true, optional = true }
neutrino-spectra-telemetry = { workspace = true, optional = true }

valence = { workspace = true, optional = true }
gauge = { workspace = true, optional = true, default-features = false }
lepton = { workspace = true, optional = true, default-features = false }

[features]
default = []
ssr = [
    "dep:valence",
    "dep:gauge",
    "gauge/ssr",
    "dep:spectra",
    "dep:spectra-core",
    "dep:neutrino-spectra-telemetry",
]
# Optional Gauge RBAC integration tests — pulls lepton/gauge SSR graph.
rbac-tests = ["ssr", "dep:gauge", "gauge/ssr", "dep:lepton", "lepton/ssr"]
# Stubs for upstream KMS / HSM `KeySource` work.
kms-aws = []
kms-gcp = []
kms-vault-transit = []
hsm-pkcs11 = []
hsm-tpm = []

[build-dependencies]
valence-codegen = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
valence = { workspace = true }
gauge = { workspace = true, features = ["ssr"] }
lepton = { workspace = true, features = ["ssr"] }
anyhow = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "workspace_members"

[[test]]
name = "product_surface"

[[test]]
name = "sealed_store_idempotent"
required-features = ["ssr"]

[[test]]
name = "vault_crud_contract"
required-features = ["ssr"]

[[test]]
name = "vault_authz_contract"
required-features = ["ssr"]

[[test]]
name = "vault_security_remediation"
required-features = ["ssr"]

[[test]]
name = "vault_gauge_authz"
required-features = ["rbac-tests"]

[[test]]
name = "vault_server_rbac"
required-features = ["rbac-tests"]

[[test]]
name = "security_contract"
required-features = ["rbac-tests"]

[[test]]
name = "access_matrix_contract"
required-features = ["rbac-tests"]
